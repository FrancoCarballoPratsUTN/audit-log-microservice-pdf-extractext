[project]
name = "audit-log-microservice"
version = "0.1.0"
description = "Audit Log microservice for pdf-extractext: append-only audit trail stored in MongoDB."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.09",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pymongo>=4.19.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"app/api/routers/*.py" = ["B008"]