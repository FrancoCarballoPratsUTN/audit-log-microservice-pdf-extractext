# Audit Log microservice behind the shared Traefik.
#
# MongoDB, Traefik and the `mired` network are provided by D:\Services.
#
# Start:
#     docker compose up --build -d
#
# The service is published on the host at:
#     curl http://localhost:8083/health
#
# The shared Traefik routes it over TLS:
#     curl -k https://audit.universidad.localhost/health

services:
  audit-log:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8083:8000"
    environment:
      SERVICE_API_TOKEN: ${SERVICE_API_TOKEN:?SERVICE_API_TOKEN is required; copy .env.example to .env and set it}
      MONGO_URI: ${MONGO_URI:?MONGO_URI is required}
      MONGO_DATABASE: ${MONGO_DATABASE:-pdf_extractext_audit}
      MONGO_AUDIT_LOGS_COLLECTION: ${MONGO_AUDIT_LOGS_COLLECTION:-audit_logs}
      MONGO_TIMEOUT_MS: ${MONGO_TIMEOUT_MS:-5000}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
      MAX_DETAILS_BYTES: ${MAX_DETAILS_BYTES:-65536}
      DEFAULT_LIMIT: ${DEFAULT_LIMIT:-10}
      MAX_LIMIT: ${MAX_LIMIT:-100}
      MAX_SKIP: ${MAX_SKIP:-10000}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_NAME: ${APP_NAME:-Audit Log Microservice}
      # false => toda la configuración sale de este entorno. true => Consul KV.
      CONSUL_ENABLED: ${CONSUL_ENABLED:-false}
      CONSUL_HTTP_ADDR: ${CONSUL_HTTP_ADDR:-}
      CONSUL_HTTP_TOKEN: ${CONSUL_HTTP_TOKEN:-}
      CONSUL_HTTP_CA_FILE: ${CONSUL_HTTP_CA_FILE:-}
      CONSUL_KV_PREFIX: ${CONSUL_KV_PREFIX:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.audit.rule=Host(`audit.universidad.localhost`)
      - traefik.http.routers.audit.entrypoints=https
      - traefik.http.routers.audit.tls=true
      - traefik.http.services.audit.loadbalancer.server.port=8000
      # Healthcheck activo de Traefik: sólo enruta a réplicas con MongoDB listo.
      - traefik.http.services.audit.loadbalancer.healthcheck.path=/readyz
      - traefik.http.services.audit.loadbalancer.healthcheck.interval=10s
      - traefik.http.services.audit.loadbalancer.healthcheck.timeout=3s
      - traefik.docker.network=mired
    networks:
      - mired
    restart: unless-stopped

networks:
  mired:
    external: true
    name: mired
