# Reglas de supresión para grype.
#
# 1) openssl: FALSOS POSITIVOS. Debian publica los parches de seguridad como
#    backports sin cambiar la versión upstream. La imagen instala
#    openssl/libssl3t64 3.5.7-1~deb13u3, que ya incluye las correcciones de:
#      - DSA-6465-1 (fijado en 3.5.7-1~deb13u2)
#      - DSA-6531-1 (fijado en 3.5.7-1~deb13u3)
#    Grype las reporta porque su catalogador "binary" compara la cadena de
#    versión upstream (3.5.7 < 3.5.8/3.5.9) y no aplica el mapeo de versiones
#    de Debian. Verificado contra el Debian Security Tracker el 2026-11-07:
#    https://security-tracker.debian.org/tracker/source-package/openssl
#    (todos estos CVE aparecen como "Resolved issues" para trixie).
#
# 2) python: CVEs del intérprete CPython 3.14.10 (compilado desde fuentes por
#    la imagen base python:3.14-slim, no es paquete Debian). No existe parche
#    en la rama 3.14: las correcciones solo están en 3.15.0a6 / 3.16.0.
#    Severidad Medium/Low y EPSS bajo (~0.3-0.4%): riesgo aceptado.
#    Revisar al migrar la imagen base a python:3.16-slim.
#
# 3) Paquetes del SO marcados "(won't fix)" por Debian: su Security Team trió
#    esos CVEs y decidió no corregirlos (requieren acceso local, configuración
#    no por defecto o son impracticables). Política adoptada: heredamos ese
#    triaje. Una sola regla por fix-state los cubre todos, presentes y futuros.
#
# 4) CVEs históricos Negligible que Debian considera no importantes (no-DSA):
#    sin exploit práctico conocido y, en este contenedor, sin contexto de
#    explotación (usuario no-root, sin shell interactiva, sin logins locales,
#    sin compilador en uso). Se listan explícitamente para auditoría.
#
# NO se suprimen a propósito: gzip CVE-2026-41992/41991 y zlib1g
# CVE-2026-76844/85091, aún sin parche de Debian. Permanecen visibles hasta
# que un rebuild con `docker build --pull` incorpore la corrección.
ignore:
  # --- openssl (falsos positivos por backport de Debian) ---
